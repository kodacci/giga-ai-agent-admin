schema: spec-driven

rules:
  tasks:
    - Every task should have business logic tests

operations:
  apply:
    guidance:
      - Run linter before making task complete
      - Run production mode build before task complete
      - Jenkins CI/CD and Sonar checks should succeed before task complete
  archive:
    guidance:
      - Check changes merged to master
      - Checkout main, fetch and pull changes from git after archiving
