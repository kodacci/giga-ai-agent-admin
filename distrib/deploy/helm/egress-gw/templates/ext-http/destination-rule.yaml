{{- range $service := .Values.extHttpsServices -}}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Values.app }}-{{ $service.name }}-destination-rule
    app.kubernetes.io/part-of: giga-ai-agent
    app.kubernetes.io/component: web-static
spec:
  host: {{ $service.host }}
  trafficPolicy:
    portLevelSettings:
      - port:
          number: {{ $service.port }}
        tls:
          {{- if $service.mtls }}
          mode: MUTUAL
          sni: {{ $service.host }}
          clientCertificate: /tls/client.pem
          privateKey: /tls/key.pem
          caCertificates: /tls/ca.pem
          {{- else }}
          mode: SIMPLE
          sni: {{ $service.host }}
          {{- end }}
  workloadSelector:
    matchLabels:
      istio: {{ $.Values.namespace }}-egressgateway
  exportTo:
    - "."
{{- end }}