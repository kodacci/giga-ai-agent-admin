apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app }}
    app.kubernetes.io/part-of: giga-ai-agent
    app.kubernetes.io/component: web-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app }}
      app.kubernetes.io/name: {{ .Values.app }}
      app.kubernetes.io/component: web-static
      app.kubernetes.io/part-of: giga-ai-agent
      app.network.policy: restricted
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ .Values.app }}
        app.kubernetes.io/name: {{ .Values.app }}
        app.kubernetes.io/component: web-static
        app.kubernetes.io/part-of: giga-ai-agent
        app.network.policy: restricted
        sidecar.istio.io/proxyCPU: {{ .Values.web_static.istio.requests.cpu }}
        sidecar.istio.io/proxyCPULimit: {{ .Values.web_static.istio.limits.cpu }}
        sidecar.istio.io/proxyMemory: {{ .Values.web_static.istio.requests.memory }}
        sidecar.istio.io/proxyMemoryLimit: {{ .Values.web_static.istio.limits.memory }}
    spec:
      containers:
        - name: {{ .Values.app }}
          image: {{ .Values.registry }}/{{ .Values.imageTag }}
          ports:
            - containerPort: 8080
              name: web-static
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              port: 8081
              path: /health
            initialDelaySeconds: 10
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              port: 8081
              path: /health
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: {{ .Values.web_static.requests.cpu }}
              memory: {{ .Values.web_static.requests.memory }}
            limits:
              cpu: {{ .Values.web_static.limits.cpu }}
              memory: {{ .Values.web_static.limits.memory }}
      imagePullSecrets:
        - name: docker-registry-creds