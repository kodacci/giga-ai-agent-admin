apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.app }}-rule
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app }}-rule
    app.kubernetes.io/part-of: giga-ai-agent
    app.kubernetes.io/component: web-static
spec:
  exportTo:
    - "."
    - istio-system
  hosts:
    - {{ .Values.host }}
  gateways:
    - "{{ .Values.namespace }}/{{ .Values.app }}-ingress-gateway"
    - mesh
  http:
    - name: web-server-route
      match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: {{ .Values.app }}-service.{{ .Values.namespace }}.svc.cluster.local
            port:
              number: 8080