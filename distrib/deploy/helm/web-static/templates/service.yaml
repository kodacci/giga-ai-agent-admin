apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.app }}-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.global.app }}-service
    app.kubernetes.io/part-of: giga-ai-agent
    app.kubernetes.io/component: web-static
spec:
  selector:
    app: {{ .Values.global.app }}
  ports:
    - name: web-static
      protocol: TCP
      port: 8080
      targetPort: web-static
    - name: health
      protocol: TCP
      port: 8081
      targetPort: health
