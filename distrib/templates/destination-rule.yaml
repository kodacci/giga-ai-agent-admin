apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: giga-ai-agent-admin-destination
  namespace: {{ namespace }}
  labels:
    app.kubernetes.io/name: giga-ai-agent-admin-destination
    app.kubernetes.io/component: web-static
    app.kubernetes.io/part-of: giga-ai-agent
spec:
  host: giga-ai-agent-admin-service.{{ namespace }}.svc.cluster.local
  exportTo:
    - "."
  workloadSelector:
    matchLabels:
      app: giga-ai-agent-admin