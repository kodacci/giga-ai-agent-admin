apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: giga-ai-agent-admin-ingress-gateway
  namespace: {{ namespace }}
  labels:
    app.kubernetes.io/name: giga-ai-agent-admin-ingress-gateway
    app.kubernetes.io/part-of: giga-ai-agent
    app.kubernetes.io/component: web-static
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        name: http
        number: 80
        protocol: HTTP
      hosts:
        - {{ host }}